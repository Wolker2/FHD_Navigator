name: Recover FHD_Navigator 0.2.8 original sources
on:
  push:
    paths:
      - '.github/workflows/publish-fhd-navigator-028.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion toolkit
        run: git clone --depth=1 https://github.com/Xenomorphchyma/SRHD-XenoModKit.git /tmp/SRHD-XenoModKit
      - name: Verify ZIP and export editable sources
        env:
          PYTHONPATH: /tmp/SRHD-XenoModKit:1FHD_Navigator_0.2.8_Nexus-GitHub/tools
        run: |
          python '1FHD_Navigator_0.2.8_Nexus-GitHub/tools/nexus_source_export.py' --archive '1FHD_Navigator_0.2.8_Nexus-GitHub/install/FHD_Navigator_0.2.8.zip' --target '1FHD_Navigator_0.2.8_Nexus-GitHub' --sha256 a96c35634aab7b2375d33b73ad291a1888a0661d4d02ccec6495b53f1a00d84a --mod 'FHD_Navigator'
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '1FHD_Navigator_0.2.8_Nexus-GitHub/SOURCE' '1FHD_Navigator_0.2.8_Nexus-GitHub/VALIDATION_REPORT.json'
          if ! git diff --cached --quiet; then
            git commit -m 'Extract FHD_Navigator 0.2.8 original source'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
